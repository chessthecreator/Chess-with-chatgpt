<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Login test</title></head>
<body>
<input id="em" placeholder="email"><br>
<input id="pw" type="password" placeholder="password"><br>
<button id="su">Create account</button>
<button id="si">Sign in</button>
<p id="out">Not signed in</p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app = initializeApp({apiKey:"AIzaSyBB1VVXGd2JmEZ9sCDiWj5u2Z6C8oq_fNI",authDomain:"chess-chatgpt.firebaseapp.com",projectId:"chess-chatgpt",storageBucket:"chess-chatgpt.firebasestorage.app",messagingSenderId:"859327563122",appId:"1:859327563122:web:78624d73fbf64d4a5749eb"});
const auth = getAuth(app);
const out = document.getElementById('out');
const em = document.getElementById('em'), pw = document.getElementById('pw');
onAuthStateChanged(auth,u=>{out.textContent=u?'Login works: '+u.email:'Not signed in'});
document.getElementById('su').onclick=()=>createUserWithEmailAndPassword(auth,em.value,pw.value).catch(e=>out.textContent='Error: '+e.message);
document.getElementById('si').onclick=()=>signInWithEmailAndPassword(auth,em.value,pw.value).catch(e=>out.textContent='Error: '+e.message);
</script></body></html>
