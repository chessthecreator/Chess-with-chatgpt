<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Login test</title></head>
<body>
<button id="g">Sign in with Google</button>
<p id="out">Not signed in</p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app = initializeApp({apiKey:"AIzaSyBB1VVXGd2JmEZ9sCDiWj5u2Z6C8oq_fNI",authDomain:"chess-chatgpt.firebaseapp.com",projectId:"chess-chatgpt",storageBucket:"chess-chatgpt.firebasestorage.app",messagingSenderId:"859327563122",appId:"1:859327563122:web:78624d73fbf64d4a5749eb"});
const auth = getAuth(app);
const out = document.getElementById('out');
getRedirectResult(auth).catch(e=>out.textContent='Error: '+e.message);
onAuthStateChanged(auth,u=>{out.textContent=u?'Login works: '+u.email:'Not signed in'});
document.getElementById('g').onclick=()=>signInWithRedirect(auth,new GoogleAuthProvider()).catch(e=>out.textContent='Error: '+e.message);
</script></body></html>
