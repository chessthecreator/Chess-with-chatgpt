<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess vs ChatGPT (GothamChess edition)</title>
<script src="coi-serviceworker.js"></script>
<style>
:root{--bg:#f4f1ea;--fg:#222;--l:#f0d9b5;--d:#b58863;--sel:#f6f669;--card:#fff;--mut:#666;--bad:#c0392b;--s:min(11.5vw,60px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c1a;--fg:#eee;--card:#2a2926;--mut:#aaa;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#1d1c1a;--fg:#eee;--card:#2a2926;--mut:#aaa;--bad:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.2rem;margin:4px 0}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:8px;text-align:center}
#board{width:calc(var(--s)*8);height:calc(var(--s)*8);display:grid;grid-template-columns:repeat(8,var(--s));grid-template-rows:repeat(8,var(--s));border:3px solid var(--fg);border-radius:3px}
.sq{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;user-select:none}
.sq img{width:92%;height:92%;pointer-events:none}
.l{background:var(--l)}.dk{background:var(--d)}
.sel{background:var(--sel)!important}
.hint::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.28)}
.last{box-shadow:inset 0 0 0 3px var(--bad)}
#status{margin:10px 0 4px;font-weight:600;text-align:center;min-height:1.4em}
button{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font-size:.9rem;cursor:pointer;margin:6px 0}
#rvp{width:calc(var(--s)*8);background:var(--card);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.85rem}#rvp:empty{display:none}
.row2{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.row2 button{padding:7px 10px;font-size:.8rem}
.bd{display:inline-block;min-width:28px;text-align:center;border-radius:10px;color:#fff;font-size:.72rem;padding:1px 5px;font-weight:700}
.sm{width:100%;border-collapse:collapse}.sm td,.sm th{padding:2px 4px;text-align:left}.mv{max-height:260px;overflow-y:auto;margin-top:6px}.mv div{padding:2px 0}
#log{width:calc(var(--s)*8);background:var(--card);border-radius:8px;padding:8px 12px;max-height:200px;overflow-y:auto;font-size:.85rem}
#log p{margin:4px 0}#log .ill{color:var(--bad);font-weight:600}
#es{font-size:.8rem;text-align:left;width:calc(var(--s)*8)}
#pg{width:calc(var(--s)*8);height:14px;display:none;margin-top:6px;accent-color:#7fa650}
</style>
<body>
<h1>♟ Chess vs ChatGPT</h1>
<div class="sub">You are White. ChatGPT opens normally, then falls apart like in GothamChess videos.</div>
<div id="board"></div>
<div id="status"></div>
<div class="row2"><button id="nw">New game</button><button id="m1">You vs ChatGPT</button><button id="m2">Stockfish vs ChatGPT</button><button id="rv">Game review</button></div><div class="row2" style="margin-top:6px"><label>Engine: <select id="eng"><option value="18">Stockfish 18</option><option value="19">Stockfish 19</option><option value="0">Built-in (weak)</option></select></label></div><div id="es" class="sub">Stockfish loads when you press “Stockfish vs ChatGPT” or “Game review”.</div><progress id="pg" max="100" value="0"></progress><div id="rvp"></div>
<div id="log"></div>
<script src="game.js"></script>
<script>
// Sprite fix: chess symbols for the white bishop and black queen.
Object.assign(IMG,{"wB":"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><text x='20' y='33' font-size='36' text-anchor='middle' fill='%23fff' stroke='%23000' stroke-width='1.4'>%E2%99%97</text></svg>","bQ":"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><text x='20' y='33' font-size='36' text-anchor='middle' fill='%23111' stroke='%23fff' stroke-width='1.2'>%E2%99%9B</text></svg>"});
render();

// Download the engine parts with a progress bar, so the browser has them cached before the engine starts.
async function downloadEngine(v){
  const n=v==18?6:5,total=(v==18?113:99)*1e6,pg=$('pg'),es=$('es');
  let got=0;pg.style.display='block';pg.value=0;
  const reqs=Array.from({length:n},(_,i)=>fetch(`engines/stockfish-${v}-part-${i}.wasm`,{cache:'force-cache'}).then(async r=>{
    if(!r.ok)throw new Error(`missing engines/stockfish-${v}-part-${i}.wasm (HTTP ${r.status})`);
    const rd=r.body.getReader();
    for(;;){const x=await rd.read();if(x.done)break;got+=x.value.length;
      const pct=Math.min(100,Math.round(got/total*100));pg.value=pct;
      es.textContent=`Downloading Stockfish ${v}: ${pct}% (${(got/1e6).toFixed(0)} of ${(total/1e6).toFixed(0)} MB)`}
  }));
  await Promise.all(reqs);
  pg.style.display='none';es.textContent=`Download finished. Starting Stockfish ${v}…`;
}

// Debug loader: starts the engine and shows each step and message under the Engine box.
function loadEngineDebug(v){return new Promise((res,rej)=>{
  const es=$('es'),log=[];
  const show=s=>{log.push(s);es.innerHTML=log.slice(-14).map(x=>x.replace(/</g,'&lt;')).join('<br>')};
  const fail=m=>rej(m+' | log: '+log.slice(-6).join(' / '));
  show('crossOriginIsolated='+self.crossOriginIsolated+', SharedArrayBuffer='+(typeof SharedArrayBuffer));
  if(W){W.terminate();W=null}
  if(!self.crossOriginIsolated)return fail('page not cross-origin isolated (reload twice)');
  let w;try{w=new Worker('engines/stockfish-'+v+'.js')}catch(e){return fail('Worker() threw: '+e)}
  show('worker created: engines/stockfish-'+v+'.js');
  let done=0;const to=setTimeout(()=>{if(!done){done=1;w.terminate();fail('timeout after 180s')}},180000);
  w.onerror=e=>{show('WORKER ERROR: '+(e.message||'(no message)')+' '+(e.filename||'')+':'+(e.lineno||''));if(!done){done=1;clearTimeout(to);fail('worker error: '+(e.message||'script failed to load'))}};
  w.onmessage=e=>{const l=String(e.data);show('engine: '+l.slice(0,140));
    if(l=='uciok'){w.postMessage('setoption name Threads value '+nth);w.postMessage('setoption name Hash value 64');w.postMessage('isready')}
    else if(l=='readyok'&&!done){done=1;clearTimeout(to);W=w;curV=v;res()}};
  show('sent: uci');w.postMessage('uci');
})}

// Used by the game: download with progress first, then start the engine.
async function loadEngine(v){
  await downloadEngine(v);
  return loadEngineDebug(v);
}
</script>
</body></html>
