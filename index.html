<body>
<h1>♟ Chess vs ChatGPT</h1>
<div class="sub">You are White. ChatGPT opens normally, then falls apart like in GothamChess videos.</div>
<div id="acct">
  <div id="acctStatus" class="sub">Not signed in (games are not saved)</div>
  <div id="ratingBox" style="display:none"></div>
  <div><input id="em" placeholder="email"> <input id="pw" type="password" placeholder="password"></div>
  <div><button id="su">Create account</button> <button id="si">Sign in</button> <button id="so" style="display:none">Sign out</button> <button id="hb" style="display:none">My history</button></div>
</div>
<div id="board"></div>
<div id="status"></div>
<div class="row2"><button id="nw">New game</button><button id="pp">Pass &amp; play</button><button id="m1">You vs ChatGPT</button><button id="m2">Stockfish vs ChatGPT</button><button id="rv">Game review</button></div><div class="row2" style="margin-top:6px"><label>Engine: <select id="eng"><option value="18">Stockfish 18</option><option value="19">Stockfish 19</option><option value="0">Built-in (weak)</option></select></label></div><div id="es" class="sub">Stockfish loads when you press “Stockfish vs ChatGPT” or “Game review”.</div><progress id="pg" max="100" value="0"></progress><div id="rvp"></div>
<div id="histbox"></div>
<div id="log"></div>
<script src="game.js"></script>
<script>
// Sharp piece graphics: one sprite sheet built into this page, 12 pieces.
const PIECE_ORDER=['wK','wQ','wB','wN','wR','wP','bK','bQ','bB','bN','bR','bP'];
function svg(p){const i=PIECE_ORDER.indexOf(p);return `<span class="pc" style="background-position:${(i*100/11).toFixed(3)}% 0"></span>`}
render();

// Download the engine parts with a progress bar, so the browser has them cached before the engine starts.
async function downloadEngine(v){
  const n=v==18?6:5,total=(v==18?113:99)*1e6,pg=$('pg'),es=$('es');
  let got=0;pg.style.display='block';pg.value=0;
  const reqs=Array.from({length:n},(_,i)=>fetch(`engines/stockfish-${v}-part-${i}.wasm`,{cache:'force-cache'}).then(async r=>{
    if(!r.ok)throw new Error(`missing engines/stockfish-${v}-part-${i}.wasm (HTTP ${r.status})`);
    const rd=r.body.getReader();
    for(;;){const x=await rd.read();if(x.done)break;got+=x.value.length;
      const pct=Math.min(100,Math.round(got/total*100));pg.value=pct;
      es.textContent=`Downloading Stockfish ${v}: ${pct}% (${(got/1e6).toFixed(0)} of ${(total/1e6).toFixed(0)} MB)`}
  }));
  await Promise.all(reqs);
  pg.style.display='none';es.textContent=`Download finished. Starting Stockfish ${v}…`;
}

// Debug loader: starts the engine and shows each step and message under the Engine box.
function loadEngineDebug(v){return new Promise((res,rej)=>{
  const es=$('es'),log=[];
  const show=s=>{log.push(s);es.innerHTML=log.slice(-14).map(x=>x.replace(/</g,'&lt;')).join('<br>')};
  const fail=m=>rej(m+' | log: '+log.slice(-6).join(' / '));
  show('crossOriginIsolated='+self.crossOriginIsolated+', SharedArrayBuffer='+(typeof SharedArrayBuffer));
  if(W){W.terminate();W=null}
  if(!self.crossOriginIsolated)return fail('page not cross-origin isolated (reload twice)');
  let w;try{w=new Worker('engines/stockfish-'+v+'.js')}catch(e){return fail('Worker() threw: '+e)}
  show('worker created: engines/stockfish-'+v+'.js');
  let done=0;const to=setTimeout(()=>{if(!done){done=1;w.terminate();fail('timeout after 180s')}},180000);
  w.onerror=e=>{show('WORKER ERROR: '+(e.message||'(no message)')+' '+(e.filename||'')+':'+(e.lineno||''));if(!done){done=1;clearTimeout(to);fail('worker error: '+(e.message||'script failed to load'))}};
  w.onmessage=e=>{const l=String(e.data);show('engine: '+l.slice(0,140));

<script>
// Pass & play: two people share this device and take turns. Both sides are human, no engine or ChatGPT.
let pp=0,ppT='w';
const origClick=window.click;
function ppStart(){
  epoch++;b=Array(64).fill(null);const k='RNBQKBNR';
  for(let c=0;c<8;c++){b[c]='b'+k[c];b[8+c]='bP';b[48+c]='wP';b[56+c]='w'+k[c]}
  b.ep=-1;b.cr='KQkq';sel=null;over=false;busy=false;last=[];hist=[];mv=0;ref=0;capB=[];
  pp=1;sfMode=0;ppT='w';

  say('Pass & play started. White moves first.');

}
window.render=function(){const el=$('board');el.innerHTML='';const side=pp?ppT:'w';
  const lm=sel!=null&&!over?legal(b,side).filter(m=>m[0]==sel).map(m=>m[1]):[];
  for(let i=0;i<64;i++){const d=document.createElement('div');
    d.className='sq '+(((i>>3)+i%8)%2?'dk':'l')+(i==sel?' sel':'')+(lm.includes(i)?' hint':'')+(last.includes(i)?' last':'');
    if(b[i])d.innerHTML=svg(b[i]);d.onclick=()=>click(i);el.appendChild(d)}};
window.click=function(i){

    const m=legal(b,ppT).find(m=>m[0]==sel&&m[1]==i);
    if(m){
      const cap=b[i];
      say(`${ppT=='w'?'White':'Black'}: ${NM[b[sel][1]]} ${sq(sel)}→${sq(i)}${cap?' (takes '+NM[cap[1]]+')':''}`);
      hist.push({pre:cp(b),col:ppT,f:sel,t:i});
      b=app(b,m);last=[i];sel=null;ppT=ppT=='w'?'b':'w';
      render();
      if(!legal(b,ppT).length){over=true;
        stat(inChk(b,ppT)?`Checkmate! ${ppT=='w'?'Black':'White'} wins.`:'Stalemate. Draw.');render();return}
      stat((inChk(b,ppT)?'Check! ':'')+(ppT=='w'?'White':'Black')+' to move');

  }

};
// Buttons: the other modes switch pass & play off; New game restarts it when it is on.
const nwOld=$('nw').onclick,m1Old=$('m1').onclick,m2Old=$('m2').onclick;

<script>
// Fast game review: one pass over every move, about 0.3 seconds of thinking each.
async function reviewFast(){
  const H=hist.slice(),box=$('rvp'),E=epoch;
  if(H.length<2){box.textContent='Play a few moves first.';return}
  box.textContent='Starting the engine…';
  await ensureEngine();
  if(E!=epoch)return;
  if(!W)return reviewBI();
  revName=`${eng}, fast review (0.3 s per move)`;
  const P=H.map(x=>x.pre).concat([cp(b)]);
  const sd=i=>i<H.length?H[i].col:(H[H.length-1].col=='w'?'b':'w');
  const search=async i=>{
    const s=sd(i);
    const ok=P[i].indexOf('wK')>=0&&P[i].indexOf('bK')>=0&&legal(P[i],s).length;
    if(!ok)return{sc:(P[i].indexOf(s+'K')<0||inChk(P[i],s))?-10000:0,sc2:null,best:null};
    const r=await ask(fenOf(P[i],s),'go movetime 300',2);
    let best=r.best;
    if(best&&best!='(none)'){const f=sqi(best.slice(0,2));if(!P[i][f]||P[i][f][0]!=s)best=null}
    return{sc:r.L[1]?r.L[1].sc:0,sc2:r.L[2]?r.L[2].sc:null,best}};
  const ev=[];
  for(let i=0;i<P.length;i++){
    if(E!=epoch)return;
    box.textContent=`Reviewing: position ${i+1}/${P.length}`;
    ev.push(await search(i));
  }
  if(E!=epoch)return;
  const out=[];H.forEach((x,i)=>out.push(analyzeSF(H,ev,i,out[i-1])));showRev(H,out);
  if(window.saveAnalysis)window.saveAnalysis(out,H.map(x=>(x.ill?'*':'')+sq(x.f)+sq(x.t)+(x.promo||'')).join(','));
}
$('rv').onclick=reviewFast;
</script>

<script>
// Move badge on the piece (like chess.com) and a sparkle animation for Brilliant moves.
(function(){

  .cbadge{position:absolute;top:-8%;right:-8%;width:44%;height:44%;border-radius:50%;color:#fff;font-weight:800;

  @keyframes sparkFly{0%{transform:translate(0,0) scale(.3);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
  .spark{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#fff 0%,#9ffff6 45%,transparent 70%);animation:sparkFly 1s ease-out infinite}
  `;

})();
function drawPos(pos,hl,mark){const el=$('board');el.innerHTML='';
  for(let i=0;i<64;i++){const d=document.createElement('div');
    const isMark=mark&&i==mark.sq;
    d.className='sq '+(((i>>3)+i%8)%2?'dk':'l')+(hl.includes(i)?' last':'')+(isMark&&mark.c=='brilliant'?' brill':'');
    if(pos[i])d.innerHTML=svg(pos[i]);
    if(isMark){
      const k=CL[mark.c];
      const badge=document.createElement('span');badge.className='cbadge';
      badge.style.background=k[1];badge.textContent=k[0]||'✓';d.appendChild(badge);
      if(mark.c=='brilliant'){
        const ring=document.createElement('span');ring.className='bring';d.appendChild(ring);
        for(let s=0;s<8;s++){const a=s*Math.PI/4,sp=document.createElement('span');sp.className='spark';
          sp.style.setProperty('--dx',(Math.cos(a)*34).toFixed(1)+'px');sp.style.setProperty('--dy',(Math.sin(a)*34).toFixed(1)+'px');
          sp.style.animationDelay=(s*0.12).toFixed(2)+'s';d.appendChild(sp)}
      }
    }
    el.appendChild(d)}}
// Mate display, Brilliant rule, and review text.
function fmtEv(sc){if(sc==null)return '';const a=Math.abs(sc);if(a>=9900)return (sc>0?'+':'-')+'M'+(10000-a);return (sc>=0?'+':'')+(sc/100).toFixed(1)}
function analyzeSF(H,ev,i,prev){const x=H[i];if(x.ill)return{c:'illegal'};
  const pre=x.pre,col=x.col,opp=col=='w'?'b':'w',ms=legal(pre,col);if(!ms.some(m=>m[0]==x.f&&m[1]==x.t))return{c:'illegal'};
  const e=ev[i],n=ev[i+1],nx=i+1<H.length?H[i+1].col:opp,me=nx==opp?-n.sc:n.sc;
  const isBest=e.best&&e.best.slice(0,4)==sq(x.f)+sq(x.t);
  const loss=isBest?0:Math.max(0,WP(e.sc)-WP(me)),gap=e.sc2!=null?WP(e.sc)-WP(e.sc2):0;
  let c;
  if(loss<=.004)c='best';else if(loss<.02)c='excellent';else if(loss<.05)c='good';else if(loss<.1)c='inacc';else if(loss<.2)c='mistake';else c='blunder';
  if(c=='best'&&gap>=.1&&ms.length>1&&e.sc<9900)c='great';
  if(loss<.02&&e.sc<9900&&me<9900){
    const p=pre[x.f][1],cap=pre[x.t]?VAL[pre[x.t][1]]:0,aft=app(pre,[x.f,x.t]);
    const attacked=gen(aft,opp,1).some(m=>m[1]==x.t);
    const b2=aft.slice();b2[x.t]=opp+aft[x.t][1];
    const defended=gen(b2,col,1).some(m=>m[1]==x.t);
    if(attacked&&!defended&&VAL[p]-cap>=200&&WP(me)>.6)c='brilliant'}
  if(i<8&&loss<.03&&c!='brilliant')c='book';
  if(prev&&(prev.c=='mistake'||prev.c=='blunder')&&loss>=.1)c='miss';
  return{c,loss,best:e.best&&e.best!='(none)'?[sqi(e.best.slice(0,2)),sqi(e.best.slice(2,4))]:null,ev:nx=='w'?n.sc:-n.sc}}
function renderList(){const r=rvState,box=$('rvp');if(!r)return;const H=r.H,out=r.out;
  const nm=[sfMode?eng:'You','ChatGPT'],S={w:{},b:{},wa:[],ba:[]};
  out.forEach((o,i)=>{const c=H[i].col;S[c][o.c]=(S[c][o.c]||0)+1;if(o.loss!=null)S[c+'a'].push(103.17*Math.exp(-4.354*o.loss)-3.17)});
  const acc=a=>a.length?Math.max(0,a.reduce((x,y)=>x+y,0)/a.length).toFixed(1)+'%':'–';
  let t=`<b>Game review</b> <small>(${revName})</small><div style="margin:6px 0"><button id="rvPrev">◀ Prev</button> <button id="rvNext">Next ▶</button> <button id="rvBack">Back to game</button></div><table class="sm"><tr><th></th><th>${nm[0]}</th><th>${nm[1]}</th></tr><tr><td>Accuracy</td><td>${acc(S.wa)}</td><td>${acc(S.ba)}</td></tr>`;
  for(const k in CL)t+=`<tr><td><span class="bd" style="background:${CL[k][1]}">${CL[k][0]||'✓'}</span> ${CL[k][2]}</td><td>${S.w[k]||0}</td><td>${S.b[k]||0}</td></tr>`;
  t+='</table><div class="mv">';
  out.forEach((o,i)=>{const x=H[i],k=CL[o.c],pc=x.pre[x.f]?NM[x.pre[x.f][1]]:'piece',bad=['inacc','mistake','miss','blunder'].includes(o.c),on=rvView&&i==r.cur;
    t+=`<div data-i="${i}" style="cursor:pointer;padding:3px 4px;border-radius:4px;${on?'background:var(--sel);color:#222':''}"><span class="bd" style="background:${k[1]}">${k[0]||'✓'}</span> ${(i>>1)+1}${x.col=='w'?'.':'…'} ${pc} ${sq(x.f)}→${sq(x.t)} <b>${k[2]}</b>${o.ev!=null?` <i>(${fmtEv(o.ev)})</i>`:''}${bad&&o.best?` — best: ${NM[x.pre[o.best[0]][1]]} ${sq(o.best[0])}→${sq(o.best[1])}`:''}</div>`});
  box.innerHTML=t+'</div>'}
function showMove(i){const r=rvState;if(!r||i<0||i>=r.H.length)return;
  if(!rvView){rvSavedLast=last.slice();rvSavedStatus=$('status').textContent}
  rvView=1;r.cur=i;
  const x=r.H[i],aft=i+1<r.H.length?r.H[i+1].pre:r.fin,o=r.out[i];
  drawPos(aft,[x.f,x.t],{sq:x.t,c:o.c});
  const k=CL[o.c],who=x.col=='w'?'White':'Black',pc=NM[x.pre[x.f][1]];
  let txt=`Move ${(i>>1)+1} ${who}: ${pc} ${sq(x.f)}→${sq(x.t)} — ${k[2]}`;
  if(o.ev!=null)txt+=` (${fmtEv(o.ev)})`;
  if(['inacc','mistake','miss','blunder'].includes(o.c)&&o.best)txt+=`. Best: ${NM[x.pre[o.best[0]][1]]} ${sq(o.best[0])}→${sq(o.best[1])}`;
  stat(txt);renderList()}

<script>
// Game history: finished games are saved to the signed-in account, and can be replayed with their review labels.
const PCS={wK:'K',wQ:'Q',wR:'R',wB:'B',wN:'N',wP:'P',bK:'k',bQ:'q',bR:'r',bB:'b',bN:'n',bP:'p'};
function encodeBoard(pos){let s='';for(let i=0;i<64;i++)s+=pos[i]?PCS[pos[i]]:'.';return s}
function decodeBoard(s){return Array.from(s,ch=>ch=='.'?null:(ch===ch.toUpperCase()?'w':'b')+ch.toUpperCase())}
let savedEp=-1,rep=null,repStatus='';
const _renderBase=window.render;
window.render=function(){_renderBase.apply(this,arguments);
  if(over&&hist.length&&savedEp!==epoch){savedEp=epoch;saveFinishedGame()}};
// Your score for the finished game: 1 = win, 0.5 = draw, 0 = loss (you are White).
function gameScore(){
  if(b.indexOf('bK')<0)return 1;
  if(b.indexOf('wK')<0)return 0;
  const stm=hist.length%2==0?'w':'b';
  if(!legal(b,stm).length){if(inChk(b,stm))return stm=='w'?0:1;return .5}
  return .5;
}
function saveFinishedGame(){
  const rec={created:Date.now(),result:$('status').textContent,
    mode:sfMode?eng:(pp?'Pass & play':'vs ChatGPT'),
    start:encodeBoard(hist[0].pre),
    moves:hist.map(x=>(x.ill?'*':'')+sq(x.f)+sq(x.t)+(x.promo||'')),
    boards:hist.map((x,i)=>encodeBoard(i+1<hist.length?hist[i+1].pre:cp(b))),
    plies:hist.length,
    score:gameScore()};
  if(window.saveGameCloud)window.saveGameCloud(rec);
}
function drawRep(){
  const r=rep.r,i=rep.i;
  const pos=decodeBoard(i<0?r.start:r.boards[i]);
  let hl=[],mark=null,lab='';
  if(i>=0){
    const m=r.moves[i].replace('*','');const f=sqi(m.slice(0,2)),t=sqi(m.slice(2,4));hl=[f,t];
    if(r.analysis&&r.analysis[i]){const o=r.analysis[i];mark={sq:t,c:o.c};
      if(CL[o.c])lab=` · ${CL[o.c][2]}`+(o.ev!=null?` (${fmtEv(o.ev)})`:'')}
  }
  drawPos(pos,hl,mark);
  stat(i<0?`${r.result} · start position`:`${r.result} · move ${i+1}/${r.plies}${lab}`);
}
function renderRepControls(){
  const c=document.getElementById('repctl');if(!c)return;
  let h='<button id="rs">Start</button> <button id="rp">◀ Prev</button> <button id="rn">Next ▶</button> <button id="rc">Close replay</button>';
  const needs=rep&&(!rep.r.analysis||rep.r.rv!==2);
  if(needs)h+=` <button id="rr">${rep.r.analysis?'Re-review (new rules)':'Review this game'}</button>`;
  c.innerHTML=h;
  document.getElementById('rs').onclick=()=>{if(rep){rep.i=-1;drawRep()}};
  document.getElementById('rp').onclick=()=>{if(rep&&rep.i>-1){rep.i--;drawRep()}};
  document.getElementById('rn').onclick=()=>{if(rep&&rep.i<rep.r.plies-1){rep.i++;drawRep()}};
  document.getElementById('rc').onclick=closeRep;
  const rr=document.getElementById('rr');
  if(rr)rr.onclick=()=>{rr.disabled=true;rr.textContent='Reviewing…';
    reviewSaved(rep.r).finally(()=>{if(rr.isConnected){rr.disabled=false;rr.textContent=rep&&rep.r.analysis?'Re-review (new rules)':'Review this game'}})};
}
function openGame(r){
  if(!rep)repStatus=$('status').textContent;
  rep={r,i:-1};
  drawRep();renderRepControls();
}
function closeRep(){
  rep=null;
  const c=document.getElementById('repctl');if(c)c.innerHTML='';
  render();stat(repStatus);
}
window.openGame=openGame;
window.closeRep=closeRep;
// Starting a new game or mode closes any open replay.
document.addEventListener('click',e=>{
  if(rep&&e.target.closest&&e.target.closest('#nw,#pp,#m1,#m2')){rep=null;const c=document.getElementById('repctl');if(c)c.innerHTML=''}
},true);
// Review a saved game from history: rebuild the moves from the saved record, then run the same review.
function guessCR(pos){let c='KQkq';
  if(pos[60]!=='wK'){c=c.replace(/[KQ]/g,'')}
  if(pos[63]!=='wR')c=c.replace('K','');
  if(pos[56]!=='wR')c=c.replace('Q','');
  if(pos[4]!=='bK'){c=c.replace(/[kq]/g,'')}
  if(pos[7]!=='bR')c=c.replace('k','');
  if(pos[0]!=='bR')c=c.replace('q','');
  return c||'-'}
function rebuildHist(r){
  const H=[];
  for(let i=0;i<r.moves.length;i++){
    const pre=decodeBoard(i==0?r.start:r.boards[i-1]);
    pre.cr=guessCR(pre);pre.ep=-1;
    if(i>0){const pm=r.moves[i-1].replace('*',''),pf=sqi(pm.slice(0,2)),pt=sqi(pm.slice(2,4));
      const pp0=H[i-1].pre;
      if(pp0[pf]&&pp0[pf][1]==='P'&&Math.abs((pt>>3)-(pf>>3))===2)pre.ep=(pf+pt)/2}
    const mv=r.moves[i],ill=mv[0]==='*',m=ill?mv.slice(1):mv;
    H.push({pre,col:i%2==0?'w':'b',f:sqi(m.slice(0,2)),t:sqi(m.slice(2,4)),ill,promo:m[4]||undefined});
  }
  return H;
}
async function reviewSaved(r){
  if(!r||!r.moves||r.moves.length<2){alert('Not enough moves to review');return}
  const sh=hist,sb=b;
  window.currentDocId=r.id;
  window.currentMovesKey=r.moves.join(',');
  window.currentMode=r.mode;
  window.currentMyColor=r.myColor||'w';
  try{
    hist=rebuildHist(r);
    b=decodeBoard(r.boards[r.plies-1]);b.cr=guessCR(b);b.ep=-1;
    await reviewFast();
  }finally{hist=sh;b=sb}
}
window.reviewSaved=reviewSaved;
window.markReviewed=a=>{if(rep){rep.r.analysis=a;rep.r.rv=2;renderRepControls()}};
</script>

<script>
// Draw rules: 50-move rule (50 moves each without a capture or pawn move), threefold repetition,
// and insufficient material. Works in live games; the game ends as a draw and is saved as a draw.
(function(){
  const _stat=window.stat;
  window.stat=function(t){
    if(over&&window.drawText&&!rvView&&!rep)t=window.drawText;
    return _stat(t);
  };
})();
const _botBase=window.bot;
window.bot=function(force){if(over)return;return _botBase.apply(this,arguments)};
function drawReason(){
  const pcs=[];
  b.forEach((p,i)=>{if(p&&p[1]!='K')pcs.push({t:p[1],i})});
  if(pcs.length===0)return 'Draw by insufficient material';
  if(pcs.length===1&&(pcs[0].t=='B'||pcs[0].t=='N'))return 'Draw by insufficient material';
  if(pcs.every(p=>p.t=='B')){
    const cols=new Set(pcs.map(p=>((p.i>>3)+(p.i&7))%2));
    if(cols.size===1)return 'Draw by insufficient material';
  }
  let n=0;
  for(let i=hist.length-1;i>=0;i--){
    const x=hist[i];
    const pawn=x.pre[x.f]&&x.pre[x.f][1]=='P';
    const cap=!!x.pre[x.t];
    if(pawn||cap)break;
    n++;
  }
  if(n>=100)return 'Draw by 50-move rule';
  const key=encodeBoard(b)+(hist.length%2==0?'w':'b');
  let cnt=1;
  for(const x of hist){if(encodeBoard(x.pre)+x.col==key)cnt++}
  if(cnt>=3)return 'Draw by threefold repetition';
  return null;
}
const _drawRender=window.render;
window.render=function(){
  if(!over&&!rep&&!rvView&&hist.length){
    const r=drawReason();
    if(r){over=true;window.drawText=r;stat(r)}
  }
  if(!over)window.drawText=null;
  return _drawRender.apply(this,arguments);
};
</script>

    }
    de.style.setProperty('--bg',dark?'#1d1c1a':'#f4f1ea');
    de.style.setProperty('--fg',dark?'#f2f2f2':'#222');
    de.style.setProperty('--mut',dark?'#cfcfcf':'#555');
    de.style.setProperty('--card',dark?'rgba(20,20,20,.72)':'rgba(255,255,255,.82)');
  }
  function saveBg(s){try{localStorage.setItem('chessBg',JSON.stringify(s))}catch(e){alert('Could not save this background: '+e.message)}}
  function currentBg(){try{return JSON.parse(localStorage.getItem('chessBg')||'null')}catch(e){return null}}
  // Panel with the thumbnails
  const panel=document.createElement('div');
  panel.id='bgpanel';
  panel.style.cssText='display:none;width:calc(var(--s)*8);background:var(--card);border-radius:8px;padding:10px;margin-top:8px';
  const grid=document.createElement('div');
  grid.style.cssText='display:flex;flex-wrap:wrap;gap:8px;justify-content:center';
  const up=document.createElement('input');
  up.type='file';up.accept='image/*';up.style.cssText='margin-top:8px;font-size:.8rem;max-width:100%';
  const tip=document.createElement('div');
  tip.style.cssText='font-size:.75rem;color:var(--mut);margin-top:4px;text-align:center';
  tip.textContent='Your own picture is saved on this device only.';
  panel.appendChild(grid);panel.appendChild(up);panel.appendChild(tip);
  $('histbox').parentNode.insertBefore(panel,$('histbox'));
  function thumb(label,style,selected,onpick){
    const d=document.createElement('div');
    d.title=label;
    d.style.cssText='width:56px;height:56px;border-radius:8px;cursor:pointer;border:3px solid '+(selected?'#7fa650':'#8884')+';'+style;
    d.onclick=onpick;
    return d;
  }
  function renderGrid(){
    grid.innerHTML='';
    const cur=currentBg();
    PRESETS.forEach(p=>{
      const sel=(cur&&cur.type==='preset'&&cur.id===p.id)||(!cur&&p.id==='default');
      const style=p.id==='default'?'background:#f4f1ea':'background:'+p.css+';background-size:cover';
      grid.appendChild(thumb(p.name,style,sel,()=>{const s={type:'preset',id:p.id};applyBg(s);saveBg(s);renderGrid()}));
    });
    if(cur&&cur.type==='custom'){
      grid.appendChild(thumb('Your picture',`background:url("${cur.data}") center/cover`,true,()=>{}));
    }
  }
  up.onchange=()=>{
    const f=up.files&&up.files[0];if(!f)return;
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,1280/img.width);
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
      const small=document.createElement('canvas');small.width=16;small.height=16;
      const sx=small.getContext('2d');sx.drawImage(c,0,0,16,16);
      const px=sx.getImageData(0,0,16,16).data;let sum=0;
      for(let i=0;i<px.length;i+=4)sum+=(px[i]*.3+px[i+1]*.59+px[i+2]*.11);
      const dark=sum/(px.length/4)<140;
      const data=c.toDataURL('image/jpeg',.8);
      const s={type:'custom',data,dark};
      applyBg(s);saveBg(s);renderGrid();
    };
    img.onerror=()=>alert('That picture could not be opened');
    img.src=URL.createObjectURL(f);
  };
  // Button in the control row
  const btn=document.createElement('button');
  btn.textContent='Background';
  btn.onclick=()=>{
    const open=panel.style.display==='none';
    panel.style.display=open?'block':'none';
    if(open)renderGrid();
  };
  $('rv').parentNode.appendChild(btn);
  applyBg(currentBg());
})();
</script>
</body></html>
