<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess vs ChatGPT (GothamChess edition)</title>
<script src="coi-serviceworker.js"></script>
<style>
:root{--bg:#f4f1ea;--fg:#222;--l:#f0d9b5;--d:#b58863;--sel:#f6f669;--card:#fff;--mut:#666;--bad:#c0392b;--s:min(11.5vw,60px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c1a;--fg:#eee;--card:#2a2926;--mut:#aaa;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#1d1c1a;--fg:#eee;--card:#2a2926;--mut:#aaa;--bad:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.2rem;margin:4px 0}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:8px;text-align:center}
#board{width:calc(var(--s)*8);height:calc(var(--s)*8);display:grid;grid-template-columns:repeat(8,var(--s));grid-template-rows:repeat(8,var(--s));border:3px solid var(--fg);border-radius:3px}
.sq{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;user-select:none}
.sq img{width:92%;height:92%;pointer-events:none}
.l{background:var(--l)}.dk{background:var(--d)}
.sel{background:var(--sel)!important}
.hint::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.28)}
.last{box-shadow:inset 0 0 0 3px var(--bad)}
#status{margin:10px 0 4px;font-weight:600;text-align:center;min-height:1.4em}
button{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font-size:.9rem;cursor:pointer;margin:6px 0}
#rvp{width:calc(var(--s)*8);background:var(--card);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.85rem}#rvp:empty{display:none}
.row2{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.row2 button{padding:7px 10px;font-size:.8rem}
.bd{display:inline-block;min-width:28px;text-align:center;border-radius:10px;color:#fff;font-size:.72rem;padding:1px 5px;font-weight:700}
.sm{width:100%;border-collapse:collapse}.sm td,.sm th{padding:2px 4px;text-align:left}.mv{max-height:260px;overflow-y:auto;margin-top:6px}.mv div{padding:2px 0}
#log{width:calc(var(--s)*8);background:var(--card);border-radius:8px;padding:8px 12px;max-height:200px;overflow-y:auto;font-size:.85rem}
#log p{margin:4px 0}#log .ill{color:var(--bad);font-weight:600}
</style></head><body>

const pre=x.pre,col=x.col,opp=col=='w'?'b':'w',ms=legal(pre,col);if(!ms.some(m=>m[0]==x.f&&m[1]==x.t))return{c:'illegal'};
const e=ev[i],n=ev[i+1],nx=i+1<H.length?H[i+1].col:opp,me=nx==opp?-n.sc:n.sc,isBest=e.best&&e.best.slice(0,4)==sq(x.f)+sq(x.t),
loss=isBest?0:Math.max(0,WP(e.sc)-WP(me)),gap=e.sc2!=null?WP(e.sc)-WP(e.sc2):0;let c;
if(loss<=.004)c='best';else if(loss<.02)c='excellent';else if(loss<.05)c='good';else if(loss<.1)c='inacc';else if(loss<.2)c='mistake';else c='blunder';
if(c=='best'&&gap>=.1&&ms.length>1)c='great';
if(loss<.02){const p=pre[x.f][1],aft=app(pre,[x.f,x.t]);
if('NBRQ'.includes(p)&&!pre[x.t]&&WP(me)>.4&&WP(e.sc)<.9){const at=gen(aft,opp).filter(m=>m[1]==x.t).map(m=>VAL[aft[m[0]][1]]);if(at.length&&VAL[p]>Math.min(...at))c='brilliant'}}
if(i<8&&loss<.03&&c!='brilliant')c='book';
if(prev&&(prev.c=='mistake'||prev.c=='blunder')&&loss>=.1)c='miss';
return{c,loss,best:e.best&&e.best!='(none)'?[sqi(e.best.slice(0,2)),sqi(e.best.slice(2,4))]:null,ev:nx=='w'?n.sc:-n.sc}}
async function reviewSF(){const H=hist.slice(),box=$('rvp'),E=epoch;if(H.length<2){box.textContent='Play a few moves first.';return}
box.textContent='Starting the engine…';await ensureEngine();if(E!=epoch)return;if(!W)return reviewBI();
const P=H.map(x=>x.pre).concat([cp(b)]),sd=i=>i<H.length?H[i].col:(H[H.length-1].col=='w'?'b':'w'),ev=[];
for(let i=0;i<P.length;i++){if(E!=epoch)return;box.textContent=`${eng} is reviewing… position ${i+1}/${P.length}`;
const s=sd(i),ok=P[i].indexOf('wK')>=0&&P[i].indexOf('bK')>=0&&legal(P[i],s).length;
if(!ok){ev.push({sc:(P[i].indexOf(s+'K')<0||inChk(P[i],s))?-10000:0});continue}
const r=await ask(fenOf(P[i],s),'go depth 14',2);ev.push({sc:r.L[1]?r.L[1].sc:0,sc2:r.L[2]?r.L[2].sc:null,best:r.best})}
const out=[];H.forEach((x,i)=>out.push(analyzeSF(H,ev,i,out[i-1])));showRev(H,out)}
$('m1').onclick=()=>{sfMode=0;init()};$('m2').onclick=async()=>{sfMode=1;$('log').innerHTML='';await ensureEngine();init()};$('rv').onclick=reviewSF;
$('nw').onclick=init;
init();
</script></body></html>
